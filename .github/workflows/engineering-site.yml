name: Engineering portfolio website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "architecture/**"
      - "engineering-decisions/**"
      - "development-journal/**"
      - "assets/**"
      - "site-content/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/prepare_docs_site.py"
      - ".github/workflows/engineering-site.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build engineering website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install MkDocs
        run: python -m pip install -r requirements-docs.txt
      - name: Stage public documentation
        run: python3 scripts/prepare_docs_site.py
      - name: Build static site
        run: mkdocs build --clean --site-dir site
      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish GitHub Pages site
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static documentation
        id: deployment
        uses: actions/deploy-pages@v4
